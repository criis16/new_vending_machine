doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # Registrar el custom type del id de Coin
        types:
            coin_id: App\Coin\Infrastructure\Persistence\Doctrine\CoinIdType
            machine_status_id: App\MachineStatus\Infrastructure\Persistence\Doctrine\MachineStatusIdType
            item_id: App\Item\Infrastructure\Persistence\Doctrine\ItemIdType

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            App\Coin:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Coin/Infrastructure/Persistence/Doctrine'
                prefix: 'App\Coin\Domain'
            App\MachineStatus:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/MachineStatus/Infrastructure/Persistence/Doctrine'
                prefix: 'App\MachineStatus\Domain'
            App\Item:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Item/Infrastructure/Persistence/Doctrine'
                prefix: 'App\Item\Domain'

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
